<!DOCTYPE html> <html lang="en" class="dark scroll-smooth"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>CARVERSE — Apex Automotive Showcase & 3D Configurator</title> <script src="https://cdn.tailwindcss.com"></script> <script> tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: { DEFAULT: '#FF2E51', hover: '#E02646' }, accent: { cyan: '#00F0FF' }, surface: { DEFAULT: '#111317', dim: '#0C0E12', border: '#282B32' }, }, fontFamily: { syne: ['Syne', 'sans-serif'], mono: ['"JetBrains Mono"', 'monospace'], }, }, }, }; </script> <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" /> <script src="https://unpkg.com/lucide@latest"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script> </head> <body class="bg-[#0c0e12] text-white selection:bg-[#ff2e51] font-mono"> <header class="sticky top-0 z-50 backdrop-blur-xl bg-[#0c0e12]/90 border-b border-white/10 px-6 py-4 flex items-center justify-between"> <div class="flex items-center gap-3"> <div class="w-3.5 h-3.5 rounded-full bg-[#ff2e51] shadow-[0_0_12px_#ff2e51]"></div> <span class="font-syne font-black text-2xl tracking-wider">CARVERSE</span> </div> <span class="text-xs text-[#ff2e51] bg-[#ff2e51]/10 border border-[#ff2e51]/30 px-3 py-1 rounded-full">SPEC // 3D STUDIO</span> </header> <main class="max-w-7xl mx-auto px-6 py-8"> <div class="mb-6"> <h1 class="font-syne text-4xl sm:text-5xl font-black uppercase text-white"> Discover Your <span class="text-[#ff2e51]">Dream Car</span> </h1> <p class="text-gray-400 text-sm mt-2">Interactive 3D WebGL Configurator with real-time livery shaders.</p> </div> <div class="relative w-full h-[520px] rounded-2xl bg-[#111317] border border-[#282b32] overflow-hidden"> <div id="three-container" class="w-full h-full cursor-grab"></div> <div class="absolute bottom-4 left-4 right-4 p-4 rounded-xl bg-black/80 backdrop-blur-md border border-white/10 flex flex-wrap items-center justify-between gap-4"> <div class="flex items-center gap-2"> <span class="text-xs text-gray-400">COLOR:</span> <button onclick="changeColor(0xff2e51)" class="w-6 h-6 rounded-full bg-[#ff2e51] border-2 border-white"></button> <button onclick="changeColor(0x00f0ff)" class="w-6 h-6 rounded-full bg-[#00f0ff] border-2 border-transparent"></button> <button onclick="changeColor(0xf3f4f6)" class="w-6 h-6 rounded-full bg-[#f3f4f6] border-2 border-transparent"></button> <button onclick="changeColor(0x10b981)" class="w-6 h-6 rounded-full bg-[#10b981] border-2 border-transparent"></button> </div> <div class="flex gap-2"> <button onclick="setCam(4,2,5)" class="px-3 py-1 text-xs border border-white/10 rounded bg-white/5 hover:border-[#ff2e51]">3/4 View</button> <button onclick="setCam(0,1.2,5.5)" class="px-3 py-1 text-xs border border-white/10 rounded bg-white/5 hover:border-[#ff2e51]">Front</button> <button onclick="setCam(6,1.2,0)" class="px-3 py-1 text-xs border border-white/10 rounded bg-white/5 hover:border-[#ff2e51]">Profile</button> </div> </div> </div> </main> <script> let scene, camera, renderer, controls, car; const c = document.getElementById('three-container'); function init() { scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(45, c.clientWidth / c.clientHeight, 0.1, 100); camera.position.set(4, 2, 5); renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(c.clientWidth, c.clientHeight); c.appendChild(renderer.domElement); controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; scene.add(new THREE.AmbientLight(0xffffff, 0.5)); const light1 = new THREE.DirectionalLight(0xff2e51, 1.8); light1.position.set(5, 8, 5); scene.add(light1); const light2 = new THREE.DirectionalLight(0x00f0ff, 1.5); light2.position.set(-5, 4, -5); scene.add(light2); scene.add(new THREE.GridHelper(20, 20, 0xff2e51, 0x1f232b)); const group = new THREE.Group(); car = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.45, 4.4), new THREE.MeshPhysicalMaterial({ color: 0xff2e51, metalness: 0.85, roughness: 0.15, clearcoat: 1 })); car.position.y = 0.45; group.add(car); const glass = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.35, 2), new THREE.MeshPhysicalMaterial({ color: 0x111317, transmission: 0.9, opacity: 0.85, transparent: true })); glass.position.set(0, 0.8, -0.2); group.add(glass); scene.add(group); function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); } loop(); } window.changeColor = (hex) => { if(car) car.material.color.setHex(hex); }; window.setCam = (x, y, z) => { camera.position.set(x, y, z); controls.target.set(0, 0.4, 0); controls.update(); }; window.addEventListener('resize', () => { camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(c.clientWidth, c.clientHeight); }); document.addEventListener('DOMContentLoaded', init); </script> </body> </html>
